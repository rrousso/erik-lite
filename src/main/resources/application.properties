# =============================================
# SPRING BOOT
# =============================================
spring.application.name=erik-lite
spring.main.web-application-type=none
spring.main.banner-mode=off

# =============================================
# DATABASE (PostgreSQL)
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/erik_lite_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# H2 (disabled \u2014 kept for future test profile)
spring.h2.console.enabled=false

# =============================================
# FLYWAY (Database Migrations)
# =============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# =============================================
# ERIK LITE - LLM MODELS
# =============================================
# Narrative Model (creative writing)
erik.narrative.model=google/gemini-2.5-pro
erik.narrative.temperature=0.4
erik.narrative.max-tokens=3000

# Analytical Model (extraction/analysis)
erik.analytical.model=google/gemini-2.5-flash
erik.analytical.temperature=0.3
erik.analytical.max-tokens=6000

# Shared API key
erik.api-key=${OPENROUTER_API_KEY:}

# =============================================
# ERIK LITE - CONTEXT WINDOW
# =============================================
erik.round-window-size=6
erik.round-threshold-size=18

# =============================================
# ERIK LITE - DEBUG
# =============================================
erik.debug.enabled=true

# =============================================
# LOGGING
# =============================================
logging.level.root=WARN
logging.level.com.github.rrousso.erik_lite=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n