# =============================================
# TEST PROFILE \u2014 H2 in-memory database
# =============================================
spring.datasource.url=jdbc:h2:mem:erik_lite_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA \u2014 let Flyway handle schema, don't validate against H2
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway \u2014 use test-specific migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/test-migration

# H2 console (optional, handy for debugging tests)
spring.h2.console.enabled=false

# Disable web server for tests
spring.main.web-application-type=none

# Erik config \u2014 dummy values for tests
erik.api-key=test-key-not-real
erik.narrative.model=test/model
erik.narrative.temperature=0.4
erik.narrative.max-tokens=100
erik.analytical.model=test/model
erik.analytical.temperature=0.3
erik.analytical.max-tokens=100
erik.round-window-size=6
erik.round-threshold-size=18
erik.debug.enabled=false
erik.extraction.frequency=1
erik.extraction.enabled=true
erik.extraction.always-extract-on-end=true
erik.extraction.always-extract-on-start=true
erik.events.keep-recent-exchanges=10
erik.events.compress-frequency=20
erik.events.always-keep-major=true